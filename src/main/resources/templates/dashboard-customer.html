<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Customer Dashboard — EcommercePlatform"/>
  <title>Customer Dashboard — EcommercePlatform</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body class="dashboard-page">
<div class="dash-wrapper">

  <!-- Header -->
  <header class="dash-header">
    <div class="brand">
      <div class="brand-icon">🛒</div>
      <span class="brand-name">EcommercePlatform</span>
    </div>
    <div class="dash-user-info">
      <div class="avatar" id="avatarInitial">?</div>
      <div>
        <div class="dash-username" id="headerUsername">Loading…</div>
        <span class="dash-role-badge customer">Customer</span>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dash-main">
    <div class="dash-card">
      <span class="role-icon">🛍️</span>
      <h1>Customer Dashboard</h1>
      <p class="dash-welcome-sub">
        Welcome, <strong id="welcomeUsername">…</strong>!<br/>
        You're signed in as a <strong>Customer</strong>.
      </p>

      <!-- Danger Zone -->
      <div class="danger-zone">
        <h3>⚠ Danger Zone</h3>
        <button id="deleteBtn" class="btn btn-danger" onclick="deleteAccount()">
          🗑 Delete My Account
        </button>
      </div>
    </div>
  </main>

</div>

<script th:src="@{/js/utils.js}"></script>
<script>
  // Guard — must be a customer
  if (!requireAuth('customer')) { /* redirected */ }

  const username = getUsername() || 'Customer';
  document.getElementById('headerUsername').textContent = username;
  document.getElementById('welcomeUsername').textContent = username;
  document.getElementById('avatarInitial').textContent = username.charAt(0).toUpperCase();

  async function deleteAccount() {
    if (!confirm('Are you sure you want to permanently delete your account? This cannot be undone.')) return;
    const btn = document.getElementById('deleteBtn');
    setLoading(btn, true);

    const result = await apiPut('/account/delete', undefined, true);
    setLoading(btn, false);

    if (result.ok) {
      showToast('Account deleted. Goodbye!');
      setTimeout(() => { clearToken(); window.location.href = '/login'; }, 1600);
    } else {
      showToast(result.data || 'Could not delete account.', 'error');
    }
  }
</script>
</body>
</html>
