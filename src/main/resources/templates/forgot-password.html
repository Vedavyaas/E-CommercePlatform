<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Reset your EcommercePlatform account password."/>
  <title>Forgot Password — EcommercePlatform</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="page-center">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">🛒</div>
      <span class="brand-name">EcommercePlatform</span>
    </div>

    <h1 class="page-title">Reset password</h1>
    <p class="page-sub">Enter your username and choose a new password.</p>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label for="fp-username">Username</label>
        <input id="fp-username" type="text" placeholder="your_username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="fp-newpass">New password</label>
        <input id="fp-newpass" type="password" placeholder="••••••••" autocomplete="new-password" required/>
      </div>
      <div class="form-group">
        <label for="fp-confirm">Confirm new password</label>
        <input id="fp-confirm" type="password" placeholder="••••••••" autocomplete="new-password" required/>
      </div>

      <button id="resetBtn" type="submit" class="btn btn-primary" style="margin-top:0.6rem;">
        Reset Password
      </button>
    </form>

    <div class="link-row center" style="margin-top:1.2rem;">
      <a href="/login" class="text-link">← Back to Sign In</a>
    </div>
  </div>
</div>

<script th:src="@{/js/utils.js}"></script>
<script>
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn      = document.getElementById('resetBtn');
    const username = document.getElementById('fp-username').value.trim();
    const newPass  = document.getElementById('fp-newpass').value;
    const confirm  = document.getElementById('fp-confirm').value;

    if (!username || !newPass || !confirm) {
      showToast('Please fill in all fields.', 'error');
      return;
    }
    if (newPass !== confirm) {
      showToast('Passwords do not match.', 'error');
      return;
    }

    setLoading(btn, true);
    const result = await apiPutParams('/api/user/rest', { username, newPassword: newPass });
    setLoading(btn, false);

    if (result.ok) {
      showToast('Password reset! Redirecting to login…');
      setTimeout(() => { window.location.href = '/login'; }, 1400);
    } else {
      showToast(result.data || 'Could not reset password.', 'error');
    }
  });
</script>
</body>
</html>
