<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Create your EcommercePlatform account as a Vendor or Customer."/>
  <title>Create Account — EcommercePlatform</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="page-center">
  <div class="card">

    <div class="brand">
      <div class="brand-icon">🛒</div>
      <span class="brand-name">EcommercePlatform</span>
    </div>

    <h1 class="page-title">Create account</h1>
    <p class="page-sub">Join us as a Vendor or Customer.</p>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" type="text" placeholder="choose_a_username" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@email.com" autocomplete="email" required/>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="••••••••" autocomplete="new-password" required/>
      </div>
      <div class="form-group">
        <label for="reg-role">Role</label>
        <select id="reg-role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="VENDOR">Vendor</option>
          <option value="CUSTOMER">Customer</option>
        </select>
      </div>

      <button id="registerBtn" type="submit" class="btn btn-primary" style="margin-top:0.6rem;">
        Create Account
      </button>
    </form>

    <div class="divider">already have an account?</div>
    <a href="/login" class="btn btn-ghost">Sign In</a>
  </div>
</div>

<script th:src="@{/js/utils.js}"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const role     = document.getElementById('reg-role').value;

    if (!username || !email || !password || !role) {
      showToast('Please fill in all fields.', 'error');
      return;
    }

    setLoading(btn, true);
    const result = await apiPost('/api/user/create', { username, email, password, role });
    setLoading(btn, false);

    if (result.ok) {
      showToast('Account created! Redirecting to login…');
      setTimeout(() => { window.location.href = '/login'; }, 1400);
    } else {
      showToast(result.data || 'Could not create account.', 'error');
    }
  });
</script>
</body>
</html>
